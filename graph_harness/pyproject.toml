[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probability-graph-harness"
version = "0.6.0"
description = "Isolated online Agent Harness with probability gating and recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.18,<6"]
remote = ["litellm>=1.70,<2"]

[project.scripts]
appworld-harness = "start_appworld_online_pilot:main"
probability-harness = "harness.cli:main"
probability-harness-check = "harness.doctor:main"

[tool.setuptools]
py-modules = ["dataset_selection", "start_appworld_online_pilot", "run_appworld_online_pilot", "evaluate_appworld_official"]

[tool.setuptools.packages.find]
include = ["harness*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.package-data]
harness = ["resources/*.drawio"]

